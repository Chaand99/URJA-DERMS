<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urja | Secure Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="animated-bg">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card glass-card">

            <div class="login-header">
                <div class="logo">
                    <i class="fa-solid fa-bolt-lightning logo-icon"></i>
                    <h2 class="logo-text">Ur<span>ja</span></h2>
                </div>
                <p class="subtitle">Sign in to your command center</p>
            </div>

            <!-- Inline Authentication Error Message Box -->
            <div id="loginErrorMessage" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 10px 14px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 1.25rem; align-items: center; gap: 8px;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="loginErrorText">Invalid email or password.</span>
            </div>

            <form class="login-form" id="loginForm">

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" class="form-control with-icon" id="emailInput" placeholder="admin@urja-energy.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" class="form-control with-icon" id="passwordInput" placeholder="••••••••••••" required>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <div class="form-actions">
                    <label class="checkbox-container">
                        <input type="checkbox" checked>
                        <span class="checkmark"></span>
                        Remember Me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                    <span id="btnText">Authenticate</span>
                    <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
                </button>

            </form>

            <div class="login-footer">
                <p><i class="fa-solid fa-shield-halved"></i> 256-bit AES Encryption Active</p>
            </div>

        </div>
    </div>

    <script type="module" src="js/login.js"></script>
</body>
</html>
