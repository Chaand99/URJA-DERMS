<div class="dashboard-body alerts-body" style="padding-bottom: 3.5rem;">
    <section class="welcome-section glass-card" style="padding: 1.5rem 2.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;">
        <div class="welcome-text">
            <h1>Active System <span class="gradient-text">Alerts & Incident Logs</span></h1>
            <p>Real-time telemetry diagnostics, fault monitoring, and historical event logs.</p>
        </div>
        <div class="welcome-badge" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.4rem 1rem; border-radius: 12px;">
            <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i>
            <span style="color: #ef4444; font-weight: 600; font-size: 0.8rem;" class="active-node-name"><span class="node-label">Active Node: Node #04-A</span></span>
        </div>
    </section>

    <div class="panel-card glass-card system-alerts-panel" style="padding: 1.75rem;">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <h3 style="display: flex; align-items: center; gap: 8px; font-size: 1.05rem;">
                <i class="fa-solid fa-shield-halved" style="color: var(--text-secondary);"></i> All Logged Events
            </h3>
            <span class="badge" id="alertsCountBadge" style="background: rgba(37, 99, 235, 0.1); color: var(--primary-blue-light); border: 1px solid rgba(37, 99, 235, 0.3); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem;">Loading Live Incidents...</span>
        </div>

        <div style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap;">
            <button class="alert-filter-btn active" data-filter="all" style="background: rgba(37,99,235,0.25); border: 1px solid var(--primary-blue); color: #fff; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500;">All Events</button>
            <button class="alert-filter-btn" data-filter="critical" style="background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #ef4444; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500;">Critical</button>
            <button class="alert-filter-btn" data-filter="warning" style="background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); color: #f59e0b; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500;">Warning</button>
            <button class="alert-filter-btn" data-filter="info" style="background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25); color: #60a5fa; padding: 4px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500;">Info</button>
        </div>

        <div class="alerts-list" id="alertsListContainer" style="display: flex; flex-direction: column; gap: 1rem;">
            <div style="text-align: center; color: var(--text-muted); padding: 2rem;">
                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Fetching system alerts and cortex events...
            </div>
        </div>
    </div>
</div>
